# CI ЦінаБот: тести й відомі CVE у залежностях.
# Ruff поки не вмикаємо: у проєкті 39 давніх зауважень — спершу почистити, тоді додати крок `ruff check .`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (lock з хешами)
        run: pip install --require-hashes -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Known vulnerabilities
        run: pip-audit -r requirements.txt --require-hashes --disable-pip
