                                        {"@context":"https://schema.org/","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Як діє Нурофєн?","acceptedAnswer":{"@type":"Answer","text":"\u003Cp\u003EІбупрофен, як основний інгредієнт препарату, пригнічує вироблення активних речовин в організмі, які відповідають за розвиток запалення, підвищення температури і прояв больових відчуттів.\u003C/p\u003E\r\n"}},{"@type":"Question","name":"Скільки зберігається після відкриття флакона Нурофєн суспензія для дітей?","acceptedAnswer":{"@type":"Answer","text":"\u003Cp\u003EНурофєн в формі суспензії необхідно використати протягом 6 місяців після порушення цілісності кришки флакону.\u003C/p\u003E\r\n"}},{"@type":"Question","name":"Чи можна розводити Нурофєн в формі суспензії водою?","acceptedAnswer":{"@type":"Answer","text":"\u003Cp\u003EУ розведенні немає необхідності, так як препарат має приємний смак апельсину або полуниці, при цьому не містить цукру і барвників.\u003C/p\u003E\r\n"}},{"@type":"Question","name":"З якого віку застосовується Нурофен?","acceptedAnswer":{"@type":"Answer","text":"\u003Cp\u003EІснують різні лікарські форми Нурофен.\u003C/p\u003E\r\n\r\n\u003Cul\u003E\r\n\t\u003Cli\u003E\u003Cem\u003EДля дітей від 3 місяців\u003C/em\u003E використовують суспензію і супозиторії.\u003C/li\u003E\r\n\t\u003Cli\u003E\u003Cem\u003EДля дорослих і дітей старше 12 років\u003C/em\u003E використовують капсули і таблетки з дозуванням 400 мг ібупрофену.\u003C/li\u003E\r\n\t\u003Cli\u003E\u003Cem\u003EДітям старше 6 років\u003C/em\u003E дозволені до використання таблетки в дозі 200 мг.\u003C/li\u003E\r\n\u003C/ul\u003E\r\n"}},{"@type":"Question","name":"Як приймається Нурофєн?","acceptedAnswer":{"@type":"Answer","text":"\u003Cp\u003E\u003Cem\u003EТаблетки і капсули\u003C/em\u003E приймають усередину, запиваючи водою. При чутливому шлунку слід приймати під час їжі.\u003C/p\u003E\r\n\r\n\u003Cp\u003E\u003Cem\u003EСуспензія\u003C/em\u003E оснащена мірним шприцом, який можна помі
