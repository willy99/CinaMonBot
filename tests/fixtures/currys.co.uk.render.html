        {"@context":"http://schema.org/","@type":"Product","@id":"/products/apple-refurbished-airpods-4-with-active-noise-cancellation-white-very-good-condition-10287145.html#Product","name":"APPLE Refurbished AirPods 4 with Active Noise Cancellation - White (Very Good Condition)","description":"The Apple AirPods 4 with Active Noise Cancellation bring you a totally transformed audio experience. Adaptive Audio tweaks the noise control to your changing environment as you go about your day. Transparency mode is ideal when you're out on a run – you can stay connected to your surroundings while you listen. And an updated fit means they're comfy from AM to PM.Good to know- REBUILT FOR COMFORT — AirPods 4 have been redesigned for exceptional all-day comfort and greater stability. With a refined contour, shorter stem, and quick-press controls for music or calls.- ACTIVE NOISE CANCELLATION — AirPods 4 with Active Noise Cancellation help reduce outside noise before it reaches your ears, so you can immerse yourself in what you're listening to.- HEAR THE WORLD AROUND YOU — The powerful H2 chip comes to AirPods . Adaptive Audio seamlessly blends Active Noise Cancellation and Transparency mode — which lets you comfortably hear and interact with the world around you exactly as it sounds — to provide the best listening experience in any environment. And when you're speaking to someone nearby, Conversation Awareness automatically lowers the volume of what's playing.- IMPROVED SOUND AND CALL QUALITY — Voice Isolation improves the quality of calls in loud conditions. Using advanced computational audio, it reduces background noise while isolating and clarifying the sound of your voice for whoever you're speaking to.- MAGICAL EXPERIENCE — Just say “Siri” or “Hey Siri” to play a song, make a call or check your schedule. And with Siri Interactions, now you can respond to Siri by simply nodding your head yes or shaking your head no. Pair AirPods 4 by simply placing them near your device and tapping Connect on your screen. Easily share a song or show between two sets of AirPods. A skin-detecting sensor knows to play audio only when you're wearing AirPods and pauses when you take them off. And you can track down your AirPods and Charging Case with the Find My app.- PERSONALISED SPATIAL AUDIO — Personalised Spatial Audio with dynamic head tracking places sound all around you, creating a cinema-like listening experience for music, TV shows, movies, games and more.- REDESIGNED CASE — The Charging Case is the smallest in the industry with wireless charging. Charge with an Apple Watch charger, USB-C Charge Cable or Qi-certified charger.- LONG BATTERY LIFE — With Active Noise Cancellation enabled, get up to 4 hours of listening time on a single charge and up to 20 hours using the case. And you can get up to 30 hours of total listening time without Active Noise Cancellation enabled.- DUST, SWEAT AND WATER RESISTANT — AirPods 4 and the Charging Case are rated IP54 dust, sweat and water resistant, so they'll withstand rain and heavy workouts.Very good conditionThese are refurbished AirPods in very good condition – that means it works perfectly. It comes with a charging case. There might be a couple of signs of wear and tear, and possibly some non-original bits like rubber feet. But all the important bits are just as they should be. What are refurbished AirPods?Refurbished AirPods give you great tech without blowing the budget. You'll also be helping to give tech a second life. Our Tech Experts thoroughly test each one, so you can be sure they're fully functional. And they come with a reassuring guarantee for peace of mind. That means you get cost-effective technology you can rely on, and they're more sustainable. Win-win.Please note:These AirPods have been professionally checked, tested and re-boxed by our Tech Experts. They're fully functional – there may be some very minor cosmetic imperfections. There's a reassuring 12-month guarantee, and it's a great saving over the 'as new' price.__________________________________________Please note:- Device performance and noise control features like Active Noise Cancellation, Adaptive Audio and Transparency can be affected by debris or earwax build up. Clean the device regularly to maintain performance and full feature functionality. Refer to support.apple.com/102672 for AirPods 4 cleaning instructions.- Voice Isolation, Siri Interactions, and Conversation Awareness available on compatible devices with iOS 18, iPadOS 18 or macOS Sequoia and later when paired with AirPods 4, AirPods 4 with Active Noise Cancellation or AirPods Pro 2 with the latest firmware.- Siri and activating with just “Siri” may not be available in all languages or in all areas, and features may vary by area. Compatible device and internet access required. Mobile data charges may apply. Activating with just “Siri” is not available on AirPods with the H1 headphone chip and Intel-based Mac computers. Devices must support and have the latest operating system software.- Sharing between two sets of AirPods requires a compatible Apple device with the latest operating system software.- Find My functionality requires iOS 18 or later.- Spatial Audio works with compatible content in supported apps. iPhone with TrueDepth camera required to create personalised profile.- AirPods 4 with Active Noise Cancellation support wireless charging, which requires a Qi certified wireless charger. AirPods 4 with Active Noise Cancellation charging case also works with the Apple Watch charger or USB C connector.- Earbud battery life testing conducted by Apple in July and August 2024 using pre-production AirPods 4 (Active Noise Cancellation) with Wireless Charging Case paired with pre-production iPhone 16 Pro Max units, all with pre-release software. The playlist consisted of 358 unique audio tracks purchased from the iTunes Store (256Kb/s AAC encoding). Volume was set to 50%; Spatial Audio, Conversation Awareness and Noise Control were all
