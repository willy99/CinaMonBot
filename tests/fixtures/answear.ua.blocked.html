    <style>
        .hidden-vars {
            display: none;
        }

        body {
            margin: 0;
            position: relative;
            padding: 0;
            overflow-x: hidden;
            font-size: 0.875rem;
            min-height: 100%;
            box-sizing: border-box;

            color: #000;
            background: #fff;

        h1 {
            font-size: 20px;
            font-weight: bold;

        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .contentWrapper {
            border: 1px solid #EDEDED;
            padding: 24px;
            margin-bottom: 24px;
            width: 600px;
            max-width: 90vw;
            margin-left: auto;
            margin-right: auto;
        }

        .contentMessage {
            white-space: pre-line;
        }

        .lockData {
            font-weight: bold;
        }

        .button {
            height: 44px;
            min-width: 150px;
            padding: 0 32px;

            color: white;

        }

        #error {
            display: flex;
            flex-direction: column;
            width: 100%;

            justify-content: center;
            gap: 16px;
            padding: 16px;
            box-sizing: border-box;
        }

            }

                margin-bottom: 8px;
            }

                padding: 16px;
                width: 100%;
            }

            #error {
                padding: 5px;
            }

            .contentWrapper {
                max-width: 85vw;
            }
        }

        script {
            display: none;
        }
    </style>

<body>

<p id="client-ip" class="hidden-vars">109.200.254.214</p>
<p id="error-ref" class="hidden-vars">0.593ad417.1791631091.b1c0e4f8</p>

<div id="error">
    <p>Loading deny page content…</p>
</div>

<script>
    var LANG_MAP = {"bg":"bg","com":"pl","pl":"pl","cy":"cy","cz":"cz","gr":"gr","hr":"hr","hu":"hu","it":"it","ro":"ro","si":"si","sk":"sk","ua":"ua","eu":"en","us":"en"};
    var PARTIAL_PREFIX = '403_answear_';
    var BRAND_SLUG = PARTIAL_PREFIX.replace(/^403_/, '').replace(/_$/, '');

    var isLocal = /^(localhost|127\.0\.0\.1)/.test(location.hostname);

    var base = isLocal
        ? './deny-partials/'
        : 'https://cdn.ans-media.com/deny-partials/';

    function normalizeLang(l){ l=(l||'').toLowerCase(); return (l==='eu'||l==='us')?'en':l; }

    function pickLang(hostname) {
        var params = new URLSearchParams(location.search);
        var forced = (params.get('lang') || '').toLowerCase();
        if (forced) return forced;

        if (BRAND_SLUG === 'prm') {
            var seg = (location.pathname.replace(/^\/+/, '').split('/')[0] || '').toLowerCase();
            return seg || 'en';
        }

        var h = (hostname || '').toLowerCase();
        var parts = h.split('.');
        var sub = parts[0];
        var tld = parts[parts.length - 1];

        if (LANG_MAP[sub]) return (LANG_MAP[sub] || '').toLowerCase();
        if (LANG_MAP[tld]) return (LANG_MAP[tld] || '').toLowerCase();

        return 'en';
    }

    function applyAndInject(ip, ref){
        return function(html){
            html = html.replace(/{{\s*AK_CLIENT_REAL_IP\s*}}/g, ip)
                .replace(/\%\(\s*AK_CLIENT_REAL_IP\s*\)/g, ip)
                .replace(/{{\s*AK_REFERENCE_ID\s*}}/g, ref)
                .replace(/\%\(\s*AK_REFERENCE_ID\s*\)/g, ref);
            document.getElementById('error').innerHTML = html;
            return true;
        };
    }

    function loadPartial(lang, ip, errorCode) {
        var cacheBust = (base.startsWith('http') ? ('?t=' + Date.now()) : '');
        var url = base + PARTIAL_PREFIX + lang + '.html' + cacheBust;

        var noPathSeg = !location.pathname.replace(/^\/+/, '').split('/')[0];
        var tryPrmCom = (BRAND_SLUG === 'prm') && noPathSeg && normalizeLang(lang) === 'en';

        if (tryPrmCom) {
            var fallback = base + '403_prm_com.html' + cacheBust;
            return fetch(fallback)
                .then(r => r.ok ? r.text() : fetch(url).then(r2 => {
                    if (!r2.ok) throw new Error('Partial not found');

                    return r2.text();
                }))
                .then(applyAndInject(ip, errorCode))
                .catch(e => { console.error('Load partial failed:', e); });
        }

        return fetch(url)
            .then(r => { if (!r.ok) throw new Error('Partial not found'); return r.text(); })
            .then(applyAndInject(ip, errorCode))
            .catch(e => { console.error('Load partial failed:', e); });
    }

    (function() {
        var clientIP = ((document.getElementById('client-ip') || {}).textContent || '').trim();
        var errorRef = ((document.getElementById('error-ref') || {}).textContent || '').trim();
        var lang = pickLang(location.hostname);

        document.documentElement.lang = normalizeLang(lang);

        loadPartial(lang, clientIP, errorRef)
            .catch(function() {
                document.documentElement.lang = 'en';

                return loadPartial('en', clientIP, errorRef);
            });
    })();
</script>
