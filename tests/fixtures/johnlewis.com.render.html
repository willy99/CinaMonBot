ise cancellation\nReduces up to 2x more unwanted noise than AirPods Pro 2 so you can stay fully immersed in the moment.(1)\n\n Breakthrough audio performance\nExperience breathtaking, three-dimensional audio with AirPods Pro 3. A new acoustic architecture delivers transformed bass, detailed clarity so you can hear every instrument, and stunningly vivid vocals.\n\n Heart rate sensing\nBuilt-in heart rate sensing lets you track your heart rate and calories burned for up to 50 different workout types.(2) With iPhone, you have access to the Move ring, step count and the new Workout Buddy,(6) powered by Apple Intelligence.(7)\n\n Live translation\nCommunicate across languages using Live Translation,(3) enabled by Apple Intelligence.(7) Available on iPhone 15 Pro or later running iOS 26 or later.\n\n Extended battery life\nGet up to 8 hours of listening time with Active Noise Cancellation on a single charge.(8) Or up to 10 hours in Transparency using the Hearing Aid feature.(9)\n\n Secure in-ear fit\nAll-new ear tips, now in five sizes, provide a more secure, personalised fit and better audio performance across the board.(4)\n\n Hearing health\nTake a Hearing Test in the comfort of your home.(10) Use the Hearing Aid feature,(11) now with Conversation Boost, for clearer communication.(12) And active Hearing Protection helps prevent exposure to loud environmental noise.(13)\n\n Personalised listening\nNext-generation Adaptive EQ customises a sound signature for your unique ear geometry and fit. And inward-facing microphones measure what you’re hearing for real-time adjustments.\n\n Magical experience\nAutomatic Switching lets you seamlessly switch between your Apple devices.(14) And Audio Sharing lets you share a song or show between two sets of AirPods on your iPhone, iPad or Apple TV.(15)\n\n\n\n\n (1) Testing conducted by Apple in July 2025 using AirPods Pro 3 paired with iPhone 16 with pre release AirPods firmware and iOS 26. Noise reduction was tested in accordance with IEC 60268 24. Comparison made against the bestselling wireless in ear headphones commercially available at the time of testing. Performance depends on device settings, environment and many other factors. \n (2) Built-in heart rate monitor is intended for use during workouts with the Fitness app and compatible third-party apps on iPhone running iOS 26 and later. Refer to support.apple.com/ for more information. \n (3) Live Translation with AirPods works on AirPods 4 with Active Noise Cancellation and AirPods Pro 2 and later with the latest firmware when paired with an Apple Intelligence–enabled iPhone running iOS 26 and later. Supports English (UK, US), French (France), German, Portuguese (Brazil), and Spanish (Spain). For more information, see Feature Availability. \n (4) Compared with AirPods Pro 2. \n (5) Supported on AirPods Pro 2 and later with the latest firmware when paired with a compatible iPhone or iPad running the latest OS. The Hearing Aid and Hearing Protection features are also supported on Mac with the latest software. See support.apple.com/120850 for total attenuation and more information on the Hearing Protection feature. \n (6) Requires an Apple Intelligence–enabled iPhone nearby and Bluetooth headphones with device and Siri language set to English. Apple Intelligence is available in beta. Some features may not be available in all regions or languages. For feature and language availability and system requirements, see support.apple.com/en-gb/121115. \n (7) Apple Intelligence is available in beta. Some features may not be available in all regions or languages. For feature and language availability and system requirements, see support.apple.com/en-gb/121115. \n (8) Testing conducted by Apple in July and August 2025 using pre production AirPods Pro 3 with MagSafe Charging Case paired with pre production iPhone 17 Pro units, all with pre release software. The playlist consisted of 358 unique audio tracks purchased from the iTunes Store (256Kb/s AAC encoding). Volume was set to 50% and Active Noise Cancellation was enabled. With Spatial Audio and Head Tracking enabled, listening time was up to 7.5 hours. Testing consisted of full AirPods Pro battery discharge while playing audio until the first AirPod Pro stopped playback. Battery life depends on device settings, environment, usage and many other factors. \n (9) Testing conducted by Apple in July and August 2025 using pre production AirPods Pro 3 with MagSafe Charging Case paired with pre production iPhone 17 Pro units, all with pre release software. Both volume and amplification level were set to 50% and Transparency was enabled. Testing consisted of full AirPods Pro battery discharge with the Hearing Aid feature on, with no audio playing back from iPhone, until the first AirPod Pro was fully discharged. Battery life depends on device settings, environment, usage and many other factors. \n (10) The Hearing Test feature is supported on AirPods Pro 2 and later with the latest firmware paired with a compatible iPhone or iPad with iOS 18 or iPadOS 18 and later, and it is intended for people 18 years old or older. \n (11) The Hearing Aid feature is supported on AirPods Pro 2 and later with the latest firmware when paired with a compatible iPhone, iPad or Mac with iOS 18, iPadOS 18 or macOS Sequoia and later, and is intended for people 18 years old or older with perceived mild to moderate hearing loss. \n (12) Supported on AirPods Pro 2 and later with the latest firmware when paired with a compatible iPhone running the latest software. This feature may not be available in all regions or all languages. View complete list. \n (13) The Hearing Protection feature works with AirPods Pro 2 and later with the latest firmware when paired with a compatible iPhone, iPad or Mac with iOS 18, iPadOS 18 or macOS Sequoia and later. The feature is not available in all regions or all languages. View complete list. See support.apple.com/120850 for total attenuation and more information. The Hearing Protection feature is not suitable for protection against extremely loud impulse sounds, such as fireworks, gunfire or pneumatic drills, or against sustained sounds louder than 110 dBA. \n (14) Requires an Apple Account and a compatible Apple device running the latest operating system software. \n (15) Requires a compatible Apple device running the latest operating system software. \n\n\n\n ","brand":{"@type":"Brand","name":"Apple"},"model":"AirPods Pro 3 with MagSafe Charging Case (USB-C), White","category":"Electricals > Headphones","aggregateRating":{"@type":"AggregateRating","reviewCount":303,"ratingValue":4.8},"name":"Apple AirPods Pro 3 with MagSafe Charging Case (USB-C), White","url":"https://www.johnlewis.com/apple-airpods-pro-3-with-magsafe-charging-case-usb-c-white/p114325329","productId":"114325329","image":"https://media.johnlewiscontent.com/i/JohnLewis/114323603","offers":{"@type":"Offer","sku":"114323603","price":"219.00","priceCurrency":"GBP","url":"https://www.johnlewis.com/apple-airpods-pro-3-with-magsafe-charging-case-usb-c-white/p114325329","availability":"https://schema.org/InStock","gtin12":"195950543742","hasMerchantReturnPolicy":{"@type":"MerchantReturnPolicy","applicableCountry":"GB","returnPolicyCategory":"https://schema.org/MerchantReturnFiniteReturnWindow","merchantReturnDays":30,"returnMethod":"https://schema.org/ReturnByMail","returnFees":"https://schema.org/FreeReturn"},"shippingDetails":[{"@type":"OfferShippingDetails","shippingRate":{"@type":"MonetaryAmount","value":"0.00","currency":"GBP"},"name":"Free Standard Delivery","shippingDestination":{"@type":"DefinedRegion","addressCountry":"GB"}},{"@type":"OfferShippingDetails","shippingRate":{"@type":"MonetaryAmount","value":"0.00","currency":"GBP"},"name":"Free Click & Collect","shippingDestination":{"@type":"DefinedRegion","addressCountry":"GB"}},{"@type":"OfferShippingDetails","shippingRate":{"@type":"MonetaryAmount","value":"0.00","currency":"GBP"},"name":"Free Local Col
