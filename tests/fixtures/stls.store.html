<script type="application/ld+json">{"@context":"http://schema.org/","@type":"Product","name":"Apple iPhone 16 Pro Max 256GB Natural Titanium (MYWY3) (Восстановленный, Как новый)","mpn":"MYWY3","sku":"1428052","description":"Встречайте Apple iPhone с инновационным потенциалом\n \n \n Чтобы стать обладателем флагманского iPhone 16 Pro Max Б/у, не медлите с оформлением заказа. Это первый смартфон, в который внедрена персональная AI-система информационной защиты Apple Intelligence. С инновационным изделием вы можете безопасно творить, снимать, отдыхать, работать, выражать себя. Наибольший 6,9-дюймовый OLED-экран позволяет смотреть фильмы с кинокачеством. Новейший процессор А18 «Про» гарантирует непревзойденную производительность.\n \n \n \n \n \n \n \n \n \n \n \n \n Apple iPhone: профессиональная министудия в руках\n \n \n Съемка на iPhone 16 Pro Max Б/у даже при низкой освещенности дарит впечатляющие качеством фото- и видеоматериалы. Просветленная оптика линз пропускает в светочувствительные матрицы больше света. Телефон оборудован камерами:\n \n одиночной фронтальной – на 12 Мп; \n трехмодульной тыльной – Fusion 48 + 48 + 12 Мп со сканером LiDAR. \n \n Приблизить и рассмотреть удаленные объекты помогают оптический 10х и цифровой 25х зум iPhone 16 Pro Max. Обе фотокамеры способны с киночеткостью записывать видео – 3D-формата FHD, UHD 4K с Dolby Vision, HDR. Быстро и комфортно фотографируйте, корректируйте режимы с новой боковой кнопкой-затвором.\n Прокачивайте свои режиссерские способности, задействуя обновленные съемочные режимы iPhone 16 Pro Max. Например – slow-mo, Photographic Styles, портретный с контролируемым эффектом боке, Live Photos, покадровое видео, ночной, «Таймлапс», киноэффект. Фиксируйте уникальные мгновения жизни с помощью стоп-кадров с разрешением до 8 Мп, снимков на 48 / 24 Мп, панорамы до 63 Мп.\n \n \n \n \n \n \n \n \n \n \n \n \n \n Производительность, автономность: снова выход за пределы\n \n \n Оснащение подержанного айфона включает новые 6-ядерный процессор A18 Pro, ОС iOS 18 AI-алгоритмы самообучения чипа Neural Engine, скоростное ОЗУ. Это обеспечивает аппарату выдающееся быстродействие, абсолютную инфозащиту, многозадачность применения. Операционка iPhone 16 Pro Max Б/у поможет:\n \n с помощью Writing Tools вычитывать и корректировать тексты; \n стабилизировать частоту кадров в играх с консолью и AirPods; \n сортировать, скрывать, изменять виджеты, иконки экранов; \n формировать и хранить текстовые расшифровки аудиофайлов; \n одним касанием удалять мешающие объекты с фотографий. \n \n \n Эксклюзивная AI-система Apple Intelligence, соединяющая ресурсы телефона, сервера и ChatGPT, не накапливает данные о вас. На 20% более быстрый 6-ядерный графический сопроцессор обеспечивает запись, редактирование и показ видеоконтента. С его помощью трассировка лучей в играх ускорена вдвое, что делает графику iPhone 16 Pro Max Б/у реалистичной и плавной. Автономность изделия возросла на 4 ч – слушайте саундтреки до 105 ч, смотрите фильмы до 33 ч. Быстро заряжайте АКБ от адаптеров – кабельного на 20-30 Вт, Qi мощностью до 15 Вт, индукционного MagSafe на 25 Вт.\n \n \n \n \n \n \n \n \n \n \n \n \n Дисплей: изображение лучше реальности\n \n \n Картинка на экране iPhone 16 Pro Max Б/у визуально монолитная за счет сверх плотного расположения пикселей. Диапазон яркости дисплея – от 1 до 2000 нит позволит вам наслаждаться качеством XDR и HDR контента при любом уровне подсветки. Всегда включенный экран оснащен:\n \n технологией ProMotion, изменяющей частоту смены экрана от 1 до 120 Гц для плавного реалистичного показа любого контента; \n сенсором освещенности с опцией True Tone, что делает изображение комфортно ярким и контрастным, с балансом белого. \n \n OLED-матрица с цветовым охватом DCI-P3 воспроизводит миллиард оттенков. Разрешение 2868x1320 позволяет видеть мельчайшие детали.\n \n \n \n \n \n \n \n \n \n \n \n \n Фирменный дизайн: флагман в тренде\n \n \n Корпус типа Grade 5 из титана впечатляет панелями из стекла и плоскими торцами. Дисплей iPhone 16 Pro Max Б/у – полноэкранный, крышка – матовая текстурированная, титановая проставка – скруглена в углах. Сверхпрочный Ceramic Shield надежно защищает экран. Управлять камерой удобней благодаря новой сенсорной кнопке в правом торце. Стабильную производительность изделия до 20% повышает отводящая тепло от процессора тыльная панель. Масштабируемая Island-зона содержит используемую для FaceID фронталку и спецсенсоры.\n \n \n \n \n \n \n \n \n \n \n \n \n Скоростные коммуникации: доступность без границ\n \n \n Аппарат обеспечит спутниковую связь даже там, где наземная сеть отсутствует. У вас всегда есть возможность отправить с iPhone 16 Pro Max Б/у сигнал SOS через сателлит в случае экстренной ситуации, ДТП. Две активные eSIM-карты предусмотрены для общения с абонентами сотовой связи. Качество приема-передачи сигнала гарантируют антенны 2х2, 4х4 MIMO. На скорости до 10 Гбит/с можете скачивать файлы через порт USB-C.\n \n \n Через Wi-Fi, сети 5G и сотовые благодаря селфи-камере вы можете участвовать в видеочатах в формате FHD по FaceTime. Инфообмен подержанного iPhone 16 Pro Max обеспечен энергоэффективными радиомодулями Wi-Fi v7, Bluetooth v5.3, iBeacon микролокации, NFC, GPS.\n \n \n \n \n \n \n \n \n \n Информационная безопасность: высший приоритет\n \n \n Эксклюзивная Apple Intelligence исключит доступ к вашим персональным данным и процессу их обработки в iPhone 16 Pro Max Б/у, а также в облаке даже для изготовителя аппарата. Телефон быстро и точно разблокирует для вас smart-камера распознавания по лицу. Безопасно переводить средства и оплачивать покупки онлайн и офлайн помогут технологии NFC и Face ID. Даже пробыв в воде на глубине до 6 м в течение получаса ваш iPhone 16 Pro Max Б/у продолжит работу.","image":["https://cdn.stls.store/cdn_thumbs_webp/500-500/gallery/57/39/3910517.jpeg.webp","https://cdn.stls.store/cdn_thumbs_webp/500-500/gallery/7a/b5/3910518.jpeg.webp","https://cdn.stls.store/cdn_thumbs_webp/500-500/gallery/d3/64/39
