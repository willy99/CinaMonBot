                    document.addEventListener('readystatechange', function() {
                        function createAndDispatchEchoEvent(data) {
                            var event = new CustomEvent("echoPerformanceNowEvent", {
                                detail: data,
                            });
                            window.dispatchEvent(event);
                        }

                        if (document.readyState === "interactive") {
                            let lastIntersectedTime = 0;

                            const observerCallback = function (entries, observer) {
                                entries.forEach((entry) => {
                                    if (entry.isIntersecting) {
                                        lastIntersectedTime = performance.now();
                                    }

                                    observer.unobserve(entry.target);
                                });

                                observer.disconnect();

                                // Dispatch time for last intersecting object with viewport
                                createAndDispatchEchoEvent({
                                    id: "viewportLoad",
                                    performanceNow: lastIntersectedTime,
                                });
                            };
                        
                            if (window.IntersectionObserver) {
                                // get all the els on page
                                const itemsInViewport = document.querySelectorAll('*');

                                // instantiate 
                                const intersectionObserver = new IntersectionObserver(observerCallback, {
                                    root: null,
                                    rootMargin: "0px 0px 0px 0px",
                                    threshold: 0.0,
                                });

                                // iterate over all els and observe each one
                                itemsInViewport.forEach(el => {
                                    intersectionObserver.observe(el);
                                });
                            } //END window.IntersectionObserver
                        } //END document.readyState === "interactive"
                    });
                </script>

<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is eSIM?","acceptedAnswer":{"@type":"Answer","text":"An eSIM is a digital SIM that eliminates the need for a physical SIM card. With eSIM, you can quickly and easily transfer an existing cellular plan or get a new cellular plan, all digitally. You can even store multiple eSIMs on the same device and use two phone numbers at the same time. And it’s more secure — someone can’t remove the physical SIM card if your iPhone is lost or stolen. In just a few simple steps, you are ready to make calls, send messages, and browse the web. Learn more about eSIM (Opens in a new window) . \nUse of eSIM requires a wireless service plan. Not all carriers support eSIM. Use of eSIM in iPhone may be disabled when purchased from some carriers. Check with your carrier for details and restrictions. Learn more about eSIM and carriers (Opens in a new window) ."}},{"@type":"Question","name":"Can I activate an iPhone 17 outside of the United States?","acceptedAnswer":{"@type":"Answer","text":"iPhone 16, iPhone 17e, iPhone 17, iPhone Air, iPhone 18 Pro, and iPhone Duo models purchased in the U.S. or Puerto Rico don’t have a physical SIM tray and activate only using eSIM. You can activate your iPhone outside the country if your carrier supports eSIM. Learn more about using eSIM while traveling (Opens in a new window).    While traveling internationally, your carrier may offer convenient and affordable international roaming options. Additionally, if your iPhone is unlocked, you can use a travel eSIM at your destination. Learn more about using eSIM while traveling (Opens in a new window)."}},{"@type":"Question","name":"Will my new iPhone be unlocked?","acceptedAnswer":{"@type":"Answer","text":"In most cases, yes. An iPhone purchased from Apple is unlocked. Once your new iPhone is activated, it remains unlocked, which means you can use it with any carrier that provid
