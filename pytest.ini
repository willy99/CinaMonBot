[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# NiceGUI: тестовий клієнт (фікстура `user`) запускає цей файл як головний
main_file = admin.py
markers =
    slow: повільні тести з реальним браузером (RUN_BROWSER_TESTS=1)
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
